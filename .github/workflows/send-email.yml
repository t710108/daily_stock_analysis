name: 每日股票分析与邮件推送

on:
  # 1. 允许在网页上手动点击按钮运行
  workflow_dispatch:
  # 2. 每天北京时间早上 9:00 自动运行 (UTC 1:00)
  schedule:
    - cron: '0 1 * * 1-5' 

jobs:
  analyze-and-send:
    runs-on: ubuntu-latest
    steps:
      # 下载代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 安装依赖包 (如果你的项目有 requirements.txt，会自动读取)
      - name: Install dependencies
        run: |
          pip install -r requirements.txt || echo "未找到 requirements.txt，跳过安装"

      # 运行你的股票分析主程序
      - name: Run Stock Analysis
        run: python main.py

      # 读取生成的分析报告
      - name: Read Report Content
        id: read_report
        run: |
          if [ -f stock_report.txt ]; then
            echo "REPORT_CONTENT<<EOF" >> $GITHUB_ENV
            cat stock_report.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "REPORT_CONTENT=⚠️ 未找到分析报告文件，请检查 Python 脚本是否正确生成了 stock_report.txt。" >> $GITHUB_ENV
          fi

      # 发送邮件到你的 Foxmail
      - name: Send Email with Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.126.com
          server_port: 465
          username: t710108@126.com
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: t710108@126.com
          from: "A股智能分析系统 <t710108@126.com>"
          subject: "📈 [每日简报] 今日股票分析报告"
          body: |
            你好！
            
            这是 GitHub Actions 自动为你生成的今日股票分析简报：
            
            ${{ env.REPORT_CONTENT }}
            
            ---
            此邮件由 GitHub Actions 自动触发，祝你投资顺利！
