name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *'  # 每天 UTC 09:00 (北京时间 17:00) 运行

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装项目依赖
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # 显式安装测试所需插件
        pip install pytest pytest-split pytest-cov

    - name: Run Offline Tests (Shard ${{ matrix.shard }}/3)
      run: |
        # 【关键修复】强制清除所有 Python 缓存文件，防止 Import Error
        echo "Cleaning up __pycache__..."
        find . -type d -name "__pycache__" -exec rm -rf {} +
        find . -type f -name "*.pyc" -delete
        
        echo "Running tests for shard ${{ matrix.shard }}..."
        pytest tests/ \
          --splits 3 \
          --group ${{ matrix.shard }} \
          --cov=src \
          --cov-report=xml \
          -v

    - name: Upload coverage to Codecov
      if: matrix.shard == 1  # 只在第一个分片上传覆盖率，避免冲突
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
