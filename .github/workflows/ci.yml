name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2]  # 修改点：改为从0开始

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-shard  # 确保安装了分片插件
        
        # 安装项目依赖（根据你的实际情况调整 requirements.txt 的路径）
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Offline Tests
      run: |
        # 智能目录检测逻辑
        TARGET_DIR="."
        if [ -d "daily_stock_analysis" ]; then
          TARGET_DIR="daily_stock_analysis"
        fi
        
        cd $TARGET_DIR
        
        # 执行测试，注意这里使用了 matrix.shard 变量
        # --shard-id 对应 matrix.shard (0, 1, 2)
        # --num-shards 固定为 3
        python -m pytest \
          --shard-id=${{ matrix.shard }} \
          --num-shards=3 \
          --ignore=tests/test_pipeline_single_notify_thread_safety.py \
          --ignore=tests/test_pipeline_single_stock_notify.py \
          --ignore=tests/test_threadless_test_client.py \
          tests/
