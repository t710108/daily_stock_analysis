name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3] # 分为3个分片

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 关键修改1：安装 pytest-split 而不是 pytest-shard
        pip install pytest pytest-xdist pytest-split
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Offline Tests (Shard ${{ matrix.shard }}/3)
      run: |
        # 自动检测并进入子目录
        if [ -d "daily_stock_analysis" ]; then
            cd daily_stock_analysis
            echo "Entered subdirectory: $(pwd)"
        fi

        ls -l

        # 关键修改2：使用正确的 pytest-split 语法
        # --splits 3 表示总共切3份
        # --group ${{ matrix.shard }} 表示当前跑第几份
        python -m pytest tests/ \
          --splits 3 \
          --group ${{ matrix.shard }} \
          -v

    - name: Build Backend macOS
      run: |
        echo "Simulating macOS build step..."
        # 这里放你原本第68行想执行的脚本，如果不需要可以删掉
        # bash scripts/build-backend-macos.sh 
