name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *'  # 每天 UTC 09:00 (北京时间 17:00) 运行

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 【关键修复步骤】自动检测并进入包含 src 的子目录
    # 解决 GitHub Actions checkout 后多套一层文件夹的问题
    - name: Navigate to Project Root
      run: |
        echo "当前目录内容:"
        ls -la
        if [ -d "daily_stock_analysis" ] && [ -d "daily_stock_analysis/src" ]; then
          echo "检测到子目录，正在进入 daily_stock_analysis..."
          cd daily_stock_analysis
          echo "现在位于: $(pwd)"
        else
          echo "当前目录即为根目录，无需切换。"
        fi
        # 将正确的路径写入环境变量，供后续步骤使用
        echo "PROJECT_ROOT=$(pwd)" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 确保在正确目录下安装依赖（如果 requirements.txt 在子目录里）
        if [ -f "$PROJECT_ROOT/requirements.txt" ]; then
          pip install -r $PROJECT_ROOT/requirements.txt
        fi
        pip install pytest pytest-split pytest-cov

    - name: Run Offline Tests (Shard ${{ matrix.shard }}/3)
      run: |
        # 【关键修复】在正确的项目根目录下运行测试
        cd $PROJECT_ROOT

        echo "=== 开始运行测试 (Shard ${{ matrix.shard }}/3) ==="
        echo "当前工作目录: $(pwd)"
        ls -la  # 再次确认 src 和 tests 都在当前目录下

        # 清除缓存防止干扰
        find . -type d -name "__pycache__" -exec rm -rf {} + || true

        # 设置 PYTHONPATH 为当前目录 (即包含 src 的目录)
        export PYTHONPATH=$(pwd):$PYTHONPATH

        # 运行 pytest
        python -m pytest tests/ \
          --splits 3 \
          --group ${{ matrix.shard }} \
          -v \
          --tb=short \
          --cov=src \
          --cov-report=xml:coverage.xml

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report-shard-${{ matrix.shard }}
        path: coverage.xml
