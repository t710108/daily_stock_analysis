name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *'  # 每天 UTC 09:00 (北京时间 17:00) 运行

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 1. 安装项目基础依赖
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
        # 2. 【关键修复】显式安装并行测试插件 xdist 和分片插件 split
        pip install pytest pytest-xdist pytest-split pytest-cov

    - name: Run Offline Tests (Shard ${{ matrix.shard }}/3)
      run: |
        # 【关键修复】自动进入包含 src 的子目录
        # GitHub Actions 经常把代码检出到 /home/runner/work/repo_name/repo_name/
        if [ -d "daily_stock_analysis" ]; then
          cd daily_stock_analysis
          echo "Entered subdirectory: $(pwd)"
        fi

        # 确认当前目录结构（调试用）
        ls -l
        
        # 运行测试
        # -n auto: 启用多进程 (需要 pytest-xdist)
        # --splits 3 --group ${{ matrix.shard }}: 将测试分为3组并行运行 (需要 pytest-split)
        python -m pytest tests/ \
          -n auto \
          --splits 3 \
          --group ${{ matrix.shard }} \
          -v \
          --tb=short
