name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *'  # 每天 UTC 09:00 (北京时间 17:00) 运行

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装项目依赖
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # 显式安装测试所需插件
        pip install pytest pytest-split pytest-cov

    - name: Run Offline Tests (Shard ${{ matrix.shard }}/3)
      run: |
        # 【关键修复 1】强制清除所有 Python 缓存文件，防止旧缓存导致的 Import Error
        echo "Cleaning up Python cache..."
        find . -type d -name "__pycache__" -exec rm -rf {} +
        find . -type f -name "*.pyc" -delete
        
        # 【关键修复 2】将当前工作目录加入 PYTHONPATH
        # 这样 Python 就能正确找到 src.core.pipeline 等模块
        export PYTHONPATH="${PYTHONPATH}:$(pwd)"
        
        echo "Running tests for Shard ${{ matrix.shard }}/3..."
        # 使用 pytest-split 进行分片测试
        # --splits 3: 总共分成 3 份
        # --group ${{ matrix.shard }}: 当前运行第几份
        pytest \
          --splits 3 \
          --group ${{ matrix.shard }} \
          -v \
          --tb=short \
          tests/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
