name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *'  # 每天 UTC 09:00 (北京时间 17:00) 运行

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装项目依赖
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # 显式安装测试所需插件
        pip install pytest pytest-split pytest-cov

    - name: Run Offline Tests (Shard ${{ matrix.shard }}/3)
      run: |
        # 【关键修复】自动进入包含 src 的子目录
        # 如果当前目录下没有 src，但子目录里有，就 cd 进去
        if [ ! -d "src" ] && [ -d "daily_stock_analysis/src" ]; then
          echo "Detected nested directory structure. Entering subdirectory..."
          cd daily_stock_analysis
        fi
        
        # 再次确认 src 存在
        ls -la
        
        # 运行测试并分片
        python -m pytest tests/ \
          --ignore=tests/test_realtime_monitor.py \
          -n auto \
          --splits 3 \
          --group ${{ matrix.shard }} \
          --cov=src \
          --cov-report=term-missing \
          -v
