name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-xdist pytest-shard
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Offline Tests (Shard ${{ matrix.shard }}/3)
      run: |
        # 自动检测并进入子目录 (如果存在)
        if [ -d "daily_stock_analysis" ]; then
            cd daily_stock_analysis
            echo "Entered subdirectory: $(pwd)"
        fi

        ls -l

        # 运行测试，启用多进程 + 分片
        python -m pytest tests/ \
            -n auto \
            --splits 3 \
            --group ${{ matrix.shard }} \
            -v \
            --tb=short

    # ✅ 关键修复：新增步骤（这就是你要找的第 68 行左右）
    # 必须使用单行 run，不要使用 | 符号，否则测试脚本可能匹配不到
    - name: Build Backend macOS
      run: bash scripts/build-backend-macos.sh
