name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *'  # 每天 UTC 09:00 (北京时间 17:00) 运行

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
        # 【关键修复】自动检测并进入包含 src 的子目录
        # 如果存在 daily_stock_analysis 子文件夹，就进去；否则留在当前目录
        if [ -d "daily_stock_analysis" ]; then
          cd daily_stock_analysis
        fi
        
        # 安装项目依赖
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # 显式安装测试所需插件
        pip install pytest pytest-split pytest-cov

    - name: Run Offline Tests (Shard ${{ matrix.shard }}/3)
      run: |
        # 【关键修复】再次确保我们在正确的目录下运行测试
        if [ -d "daily_stock_analysis" ]; then
          cd daily_stock_analysis
        fi

        # 【关键修复】将当前目录（即包含 src 的目录）加入 PYTHONPATH
        export PYTHONPATH=$(pwd):$PYTHONPATH
        
        # 打印当前路径和文件结构，方便调试（如果还报错，看这里的输出）
        echo "Current Directory: $(pwd)"
        ls -l
        
        # 运行测试
        pytest tests/ \
          --splits 3 \
          --group ${{ matrix.shard }} \
          -v \
          --cov=src \
          --cov-report=xml
