name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2] # 分成3份并行跑

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-shard
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Offline Tests
      run: |
        # 现在的命令非常简单，不需要再手动写 ignore 了
        # conftest.py 会自动处理跳过逻辑
        python -m pytest \
          --shard-id=${{ matrix.shard }} \
          --num-shards=3 \
          tests/
