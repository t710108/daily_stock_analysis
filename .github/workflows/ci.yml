name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *'  # 每天 UTC 09:00 (北京时间 17:00) 运行

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装项目依赖
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # 显式安装测试所需插件
        pip install pytest pytest-split pytest-cov

    - name: Run Offline Tests (Shard ${{ matrix.shard }}/3)
      run: |
        # 【关键修复】自动进入包含 src 的子目录
        # GitHub Actions 有时会将代码 checkout 到同名子文件夹中，导致路径嵌套
        if [ -d "daily_stock_analysis" ]; then
          cd daily_stock_analysis
        fi
        
        echo "当前工作目录: $(pwd)"
        ls -R  # 打印目录结构，方便排查问题
        
        # 设置环境变量，确保能识别 src 目录
        export PYTHONPATH=$(pwd):$PYTHONPATH
        
        # 运行测试分片
        python -m pytest \
          --splits 3 \
          --group ${{ matrix.shard }} \
          tests/ \
          -v \
          --tb=short

    # 【修复点】这里将 v3 升级为了 v4
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

    # 【修复点】如果有上传测试报告或日志的步骤，也需要升级
    # 注意：如果你之前的代码里有 upload-artifact，必须改为 v4
    # 如果你的代码里没有这一步，可以忽略下面这段注释的代码
    # - name: Upload test results
    #   if: always()
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: test-results-shard-${{ matrix.shard }}
    #     path: test-results/
