name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *'  # 每天 UTC 09:00 (北京时间 17:00) 运行

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装项目依赖
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # 【关键修复】显式安装 pytest 和 pytest-split 插件
        pip install pytest pytest-split pytest-cov

    - name: Run Offline Tests (Shard ${{ matrix.shard }}/3)
      run: |
        # 使用 pytest-split 进行分片测试
        # --splits 3: 总共分为3组
        # --group ${{ matrix.shard }}: 当前运行第几组
        pytest tests/ \
          --splits 3 \
          --group ${{ matrix.shard }} \
          --cov=. \
          --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
