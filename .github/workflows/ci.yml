name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *'  # 每天 UTC 09:00 (北京时间 17:00) 运行

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装项目依赖
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # 显式安装测试所需插件
        pip install pytest pytest-split pytest-cov

    - name: Run Offline Tests (Shard ${{ matrix.shard }}/3)
      run: |
        # 【关键修复】自动进入包含 src 的子目录
        # GitHub Actions 有时会将代码 checkout 到同名子文件夹中，导致路径嵌套
        if [ -d "daily_stock_analysis" ] && [ -d "daily_stock_analysis/src" ]; then
          echo "Entering project subdirectory..."
          cd daily_stock_analysis
        fi

        # 【关键修复】将当前目录（包含 src 的目录）加入 PYTHONPATH
        export PYTHONPATH=$(pwd):$PYTHONPATH
        
        echo "Current Directory: $(pwd)"
        echo "PYTHONPATH: $PYTHONPATH"
        ls -l  # 打印目录结构以便调试

        # 【关键修复】清除所有缓存，防止旧的 .pyc 文件干扰
        find . -type d -name "__pycache__" -exec rm -rf {} + || true

        # 运行测试分片
        pytest tests/ \
          --splits 3 \
          --group ${{ matrix.shard }} \
          -v \
          --tb=short
